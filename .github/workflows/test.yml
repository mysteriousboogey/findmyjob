name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/quick_validate.py skills/setup-find-my-job
      - run: python scripts/quick_validate.py skills/find-my-job
      - run: python scripts/quick_validate.py skills/prepare-job-application
